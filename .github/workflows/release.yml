name: Release

on:
  push:
    branches: ["main"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read and verify version
        id: version
        run: |
          py=$(grep -oP 'version = "\K[^"]+' plugin.py | head -1)
          js=$(python3 -c "import json;print(json.load(open('plugin.json'))['version'])")
          echo "plugin.py=$py plugin.json=$js"
          [ "$py" = "$js" ] || { echo "Version mismatch"; exit 1; }
          echo "version=$py" >> "$GITHUB_OUTPUT"
          echo "tag=v$py" >> "$GITHUB_OUTPUT"

      - name: Check whether release already exists
        id: release_check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "v${{ steps.version.outputs.version }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Release v${{ steps.version.outputs.version }} already exists. Nothing to do."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Syntax check
        run: python3 -m py_compile plugin.py segmentarr-supervisor.py

      - name: Build release zip
        run: |
          rm -rf dist segmentarr.zip
          mkdir -p dist/segmentarr
          cp plugin.py plugin.json segmentarr-supervisor.py logo.png dist/segmentarr/
          (cd dist && zip -r ../segmentarr.zip segmentarr)

      - name: Create tag
        if: steps.release_check.outputs.exists != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "v${{ steps.version.outputs.version }}" "${GITHUB_SHA}"
          git push origin "v${{ steps.version.outputs.version }}"

      - name: Publish or update release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ steps.release_check.outputs.exists }}" = "true" ]; then
            gh release upload "v${{ steps.version.outputs.version }}" segmentarr.zip --clobber
          else
            gh release create "v${{ steps.version.outputs.version }}" segmentarr.zip \
              --title "Segmentarr v${{ steps.version.outputs.version }}" \
              --generate-notes
          fi
